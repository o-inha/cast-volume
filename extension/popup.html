<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast Volume</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
  <script src="view-mode.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Cast volume</h1>
      <div class="actions">
        <button id="view-mode" type="button" aria-label="Open in a separate window" title="Open in a separate window">
          <svg id="view-mode-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4h6v6m0-6-9 9M10 5H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-5"/>
          </svg>
        </button>
        <button id="retry" type="button" aria-label="Refresh receivers" title="Refresh receivers">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4v5h-5M20 9a8 8 0 1 0 .3 5"/>
          </svg>
        </button>
      </div>
    </header>
    <p id="status" role="status">Looking for active casts…</p>
    <p id="view-status" role="status" hidden></p>
    <ul id="receivers" aria-label="Active Cast receivers" hidden></ul>
  </main>
  <template id="receiver-template">
    <li class="receiver">
      <div class="receiver-row">
        <svg class="receiver-icon device-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8V5h18v14h-6M3 12a7 7 0 0 1 7 7m-7-3a3 3 0 0 1 3 3m-3 0h.01"/>
        </svg>
        <svg class="receiver-icon group-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden>
          <path d="M18.2 1H9.8C8.81 1 8 1.81 8 2.8v14.4c0 .99.81 1.79 1.8 1.79l8.4.01c.99 0 1.8-.81 1.8-1.8V2.8c0-.99-.81-1.8-1.8-1.8zM14 3c1.1 0 2 .89 2 2s-.9 2-2 2-2-.89-2-2 .9-2 2-2zm0 13.5c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
          <circle cx="14" cy="12.5" r="2.5"/>
          <path d="M6 5H4v16c0 1.1.89 2 2 2h10v-2H6V5z"/>
        </svg>
        <span class="device-name"></span>
        <button class="drag-handle" type="button" aria-label="Reorder receiver" title="Drag to reorder. Arrow keys move up or down.">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 9H4v2h16V9zM4 15h16v-2H4v2z"/>
          </svg>
        </button>
      </div>
      <div class="volume-row">
        <input type="range" min="0" max="100" step="1" value="0" disabled>
        <span class="volume-value" aria-hidden="true">—</span>
      </div>
      <p class="detail" role="status" hidden></p>
    </li>
  </template>
</body>
</html>
